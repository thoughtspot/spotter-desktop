name: Verify Release Credentials

# Checks both halves of the release pipeline without building a release.
#
# Signing and notarization use different credentials, and a 1.7.0 release failed
# at signing immediately after the notarization credentials had been confirmed
# good — checking one proves nothing about the other, so this checks both.
#
# Neither job publishes anything. Run before tagging, or after touching signing.
on:
  workflow_dispatch:

jobs:
  notarization:
    name: Notarization credentials
    runs-on: macos-latest
    steps:
      - name: Ask Apple whether the credentials are accepted
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -z "$APPLE_ID" ] && missing="$missing APPLE_ID"
          [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] && missing="$missing APPLE_APP_SPECIFIC_PASSWORD"
          [ -z "$APPLE_TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Secrets not set:$missing"; exit 1
          fi

          # `history` is the cheapest authenticated call there is — it submits
          # nothing and only lists past submissions.
          set +e
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" > result.txt 2>&1
          status=$?
          set -e

          if [ $status -eq 0 ]; then
            echo "✅ Credentials accepted by Apple — a release build will notarize."
            head -20 result.txt
            exit 0
          fi

          if grep -q "401" result.txt; then
            echo "::error::Apple rejected the credentials (HTTP 401)."
            echo "The app-specific password has expired or been revoked. Generate"
            echo "a new one at appleid.apple.com and update the secret. An App"
            echo "Store Connect API key does not expire and would avoid this."
          else
            echo "::error::notarytool failed for another reason:"
            head -20 result.txt
          fi
          exit 1

  signing:
    name: Code signing
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Report versions
        run: |
          echo "electron-builder: $(npx electron-builder --version)"
          echo "runner macOS: $(sw_vers -productVersion) (Darwin $(uname -r))"

      # The same script the release uses, so a fix verified here cannot drift
      # away from what actually ships.
      - name: Set up the signing keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: .github/scripts/setup-keychain.sh

      - run: npm run build

      # --dir stops before the dmg; signing has already happened by then. The
      # Apple credentials are deliberately absent so notarization is skipped and
      # this job stays focused on the certificate.
      - name: Sign
        env:
          MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
        run: npx electron-builder --mac --dir --publish never

      - name: Confirm the signature
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Spotter.app
          codesign -dvv dist/mac-arm64/Spotter.app 2>&1 | grep -E "Authority|TeamIdentifier" || true
          echo "✅ signed"
