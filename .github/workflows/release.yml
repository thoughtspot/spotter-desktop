name: Release

# Tag a commit (e.g. git tag v1.4.0 && git push --tags) to build, sign, notarize
# and publish a GitHub release. electron-builder uploads latest-mac.yml alongside
# the artifacts, which is what the in-app auto-updater reads.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Imports the Developer ID certificate into a keychain this workflow owns
      # and exports CSC_KEYCHAIN/CSC_NAME. electron-builder's own import fails on
      # current runner images — see the script for the detail. Verify changes to
      # signing through the Verify Code Signing workflow, which shares this
      # script, rather than by tagging a release.
      - name: Set up the signing keychain
        env:
          # Developer ID certificate exported as base64-encoded .p12
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: .github/scripts/setup-keychain.sh

      # CSC_LINK is deliberately not passed here: given it, electron-builder
      # re-imports the certificate into a keychain of its own and fails.
      - name: Build, sign, notarize and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Notarization. electron-builder reads these directly — see
          # app-builder-lib getNotarizeOptions(). App-specific passwords get
          # revoked and expire; an App Store Connect API key does not, and is
          # the same three vars locally and here.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Baked into the renderer bundle by webpack. Without it the shipped
          # build reports no usage at all, and does so silently — analytics.js
          # disables itself rather than failing loudly.
          MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
