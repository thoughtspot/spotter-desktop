name: Verify Code Signing

# Proves out the release signing path without notarizing or publishing.
#
# Kept after the 1.7.0 signing failure because nothing local exercises this:
# local builds sign from the developer's own keychain via APPLE_IDENTITY, so
# CSC_LINK and CSC_KEY_PASSWORD are only ever used here. Run it after touching
# anything to do with signing, and before tagging a release.
on:
  workflow_dispatch:

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Report versions
        run: |
          echo "electron-builder: $(npx electron-builder --version)"
          echo "runner macOS: $(sw_vers -productVersion) (Darwin $(uname -r))"

      - name: Set up the signing keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: .github/scripts/setup-keychain.sh

      - run: npm run build

      # CSC_LINK is deliberately absent: given it, electron-builder imports the
      # certificate into a keychain of its own, which is the step that fails on
      # this runner image. CSC_KEYCHAIN and CSC_NAME point it at the keychain
      # prepared above instead.
      - name: Sign
        env:
          MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
        run: npx electron-builder --mac --dir --publish never

      - name: Confirm the signature
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Spotter.app
          codesign -dvv dist/mac-arm64/Spotter.app 2>&1 | grep -E "Authority|TeamIdentifier" || true
          echo "✅ signed"
